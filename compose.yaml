services:
  game:
    build: .
    restart: unless-stopped
    networks:
      jump-n-bump:
      tunnel:
        aliases:
          - jump-n-bump
    ports:
      - 8099:8080

# Joined by the cloudflared compose project as `external: true`; its Public
# Hostname points at http://game:8080. No port is published on the host.
networks:
  jump-n-bump:
    name: jump-n-bump
  tunnel:
    external: true
