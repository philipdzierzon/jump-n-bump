services:
  game:
    build: .
    restart: unless-stopped
    networks:
      jump-n-bump:
      tunnel:
        aliases:
          - jump-n-bump
    # Loopback only, for a browser on this box or an SSH forward. Bound wider, anyone who
    # reaches the host could send their own CF-Connecting-IP and mint a fresh limiter key per
    # request (#47); a published port also bypasses the host firewall's INPUT rules.
    ports:
      - 127.0.0.1:8099:8080
    # :9090 is /metrics (#48). Never published: #49's Prometheus scrapes game:9090 across
    # the compose network.
    # The site statistics (#46). A directory, not the file: SQLite writes a journal beside
    # it. Backup is `tar czf jnb-data.tgz data/`, which is every bind mount the box has.
    volumes:
      - ./data/relay:/app/data

# Joined by the cloudflared compose project as `external: true`; its Public
# Hostname points at http://game:8080. The only published port is loopback (above).
#
# Cloudflare Bot Fight Mode and Under Attack mode must stay OFF for this
# hostname: both answer the WebSocket upgrade with an HTML challenge page, and
# no WAF Skip rule exempts it. With either on, the game cannot connect (#158).
networks:
  jump-n-bump:
    name: jump-n-bump
  tunnel:
    external: true
